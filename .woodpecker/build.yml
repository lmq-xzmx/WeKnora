# ─────────────────────────────────────────────────────────────
# 常规构建 —— NAS 构建机
#
# 为什么构建放 NAS：
#   - NAS 有 868G 大盘（Docker Root Dir 在 /vol1/docker），构建缓存与中间层
#     落在这里，不占生产机硬盘（生产机硬盘留给业务数据）
#   - NAS 只有 4 核 / 8G 内存，构建慢，日常「不紧急」的构建可以慢慢跑
#   - 紧急发布打 tag 触发 urgent 工作流，由生产 ECS 上的 agent 快速构建
#
# ⚠️ 本工作流**只构建、不部署**。生产环境是手动发布：
#   构建完在 Woodpecker 界面点「Trigger Pipeline」触发 deploy 工作流，
#   或用 API/CLI 触发（见 .woodpecker/deploy.yml 顶部说明）。
#   这样「代码合入」和「上生产」是分开的两步，不成熟的版本不会被自动推上去。
#
# 标签路由（Woodpecker 3.19）：
#   workflow 的 labels 必须是 agent labels 的子集，格式为 key=value。
#   - NAS agent: platform=nas,builder=nas → 只接 build 工作流
#   - ECS agent: platform=nas,builder=ecs → 只接 deploy / urgent 工作流
#   两个 agent 的标签集合互不包含，因此路由是确定的（不会互相抢单）。
#
# 工作流名 = 文件名（build.yml → build）。
# ─────────────────────────────────────────────────────────────
name: build
when:
  - event: push
    branch: main
labels:
  platform: nas
  builder: nas
steps:
  # ── 平台自检：生产镜像必须是 linux/amd64 ────────────────
  platform-check:
    image: 100.108.142.49:5000/golang:1.21-alpine
    commands:
      - uname -m
      - test "$(uname -m)" = "x86_64" || (echo "构建机不是 x86_64，中止" && exit 1)

  # ── 构建并推送镜像 ────────────────────────────────────
  # 具体构建哪些镜像、按变更文件裁剪的逻辑在 scripts/ci-build.sh，
  # 与 urgent.yml 共用同一份，保证两条路径产物一致。
  build:
    image: 100.108.142.49:5000/docker:cli
    environment:
      GOPROXY_ARG: https://goproxy.cn,direct
      APK_MIRROR_ARG: mirrors.aliyun.com
      NPM_MIRROR_ARG: https://registry.npmmirror.com
      RUSTUP_MIRROR_ARG: mirrors.aliyun.com
      APT_MIRROR: mirrors.aliyun.com
      PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
      UV_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
    commands:
      - sh scripts/ci-build.sh

  # ── Registry 清理：防止 CI 旧版本镜像在 NAS 无限堆积 ────
  # 逻辑在 scripts/ci-registry-cleanup.sh 里（含 digest 校验，
  # 确保不会连带删掉生产正在用的 latest）。此处只负责调用。
  cleanup-registry:
    image: 100.108.142.49:5000/alpine:3.20
    commands:
      - apk add --no-cache curl
      - sh scripts/ci-registry-cleanup.sh
