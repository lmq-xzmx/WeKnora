# ─────────────────────────────────────────────────────────────
# 发布 —— 生产 ECS 上构建并部署（打 tag 触发）
#
# 为什么「发布」是打 tag：
#   生产环境要「代码合入」与「上生产」分开。push 到 main 只跑 build.yml
#   （只构建、不部署），不成熟的版本不会被自动推上生产。
#   等确认可以发布了，再打一个 tag：
#       git tag v1.2.3 && git push gitea v1.2.3
#   这时才在生产 ECS 上构建并部署 —— 一步到位，且由人显式发起。
#
# 为什么发布构建放 ECS（不在 NAS）：
#   发布要快。NAS 只有 4 核，日常 CI 构建慢慢跑没关系，
#   但发布要分钟级出镜像。ECS 构建天然 amd64、走 Tailscale、能 SSH 生产机。
#   日常 CI 构建仍然在 NAS 上跑，生产机硬盘不会因为构建缓存被占。
#
# 构建与部署逻辑与 build.yml 共用同一份脚本，产物一致。
# ─────────────────────────────────────────────────────────────
name: release
when:
  - event: tag
labels:
  platform: nas
  builder: ecs
steps:
  # ── 平台自检 ──────────────────────────────────────────
  platform-check:
    image: 100.108.142.49:5000/golang:1.21-alpine
    commands:
      - uname -m
      - test "$(uname -m)" = "x86_64" || (echo "构建机不是 x86_64，中止" && exit 1)

  # ── 复用 NAS 已构建的镜像（没有才在 ECS 上重建）────────
  # 日常 push main 时 NAS 已经把镜像构建好推到 registry 了，
  # 发布时不必再编译一遍 —— 直接把那个 commit 的镜像重打成 latest，秒级完成。
  build:
    image: 100.108.142.49:5000/docker:cli
    environment:
      GOPROXY_ARG: https://goproxy.cn,direct
      APK_MIRROR_ARG: mirrors.ustc.edu.cn
      NPM_MIRROR_ARG: https://registry.npmmirror.com
      RUSTUP_MIRROR_ARG: mirrors.aliyun.com
      CARGO_MIRROR_ARG: sparse+https://rsproxy.cn/index/
      APT_MIRROR: mirrors.ustc.edu.cn
      PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
      UV_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
    commands:
      - sh scripts/ci-release.sh

  # ── 滚动更新生产机 ────────────────────────────────────
  deploy:
    image: 100.108.142.49:5000/golang:1.21-alpine
    commands:
      - apk add --no-cache openssh-client
      - sh scripts/ci-deploy.sh

  # ── Registry 清理 ─────────────────────────────────────
  cleanup-registry:
    image: 100.108.142.49:5000/alpine:3.20
    commands:
      - apk add --no-cache curl
      - sh scripts/ci-registry-cleanup.sh
