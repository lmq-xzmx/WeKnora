# ─────────────────────────────────────────────────────────────
# 常规发布 —— 生产 ECS 部署机
#
# 为什么部署不放 NAS：
#   - NAS 跑的是 userspace 模式的 tailscale，宿主没有真实 tailnet IP，
#     走 Tailscale 到不了生产机（ping 100.x 不通，只能走公网 IP）
#   - ECS 本来就装着部署私钥、走 Tailscale，是天然的部署机
#   - 顺带的好处：NAS 上不需要存放任何生产凭据
#
# depends_on: build → 等 NAS 把镜像推完再部署，避免拉到旧镜像
# ─────────────────────────────────────────────────────────────
name: deploy
when:
  - event: push
    branch: main
labels:
  platform: nas
  builder: ecs
depends_on:
  - build
steps:
  # ── 滚动更新生产机 ────────────────────────────────────
  deploy:
    image: 100.108.142.49:5000/golang:1.21-alpine
    commands:
      - apk add --no-cache openssh-client
      - sh scripts/ci-deploy.sh

  # ── Registry 清理：防止 CI 旧版本镜像在 NAS 无限堆积 ────
  # 逻辑在 scripts/ci-registry-cleanup.sh 里（含 digest 校验，
  # 确保不会连带删掉生产正在用的 latest）。此处只负责调用。
  cleanup-registry:
    image: 100.108.142.49:5000/alpine:3.20
    commands:
      - apk add --no-cache curl
      - sh scripts/ci-registry-cleanup.sh
