# WeKnora CI/CD —— Woodpecker 3.x（2026-10-28 实测跑通：docker CLI 直构 + 部署）
#
# 链路：Mac push → Gitea webhook → Woodpecker（NAS）→ agent（生产 ECS，amd64）
#       → 构建镜像 → 推内网 registry → SSH 到两台生产机 docker-compose pull && up -d
#
# 铁律：Mac（arm64）不构建生产镜像；产物必须 linux/amd64。
# 依赖：agent 已配 WOODPECKER_BACKEND_DOCKER_VOLUMES 注入 docker.sock 与部署私钥；
#       基础镜像（docker:cli / golang:1.21-alpine）与 clone 插件均在内网 registry。

when:
  - event: push
    branch: main
  - event: tag

steps:
  # ── 平台自检 ─────────────────────────────────────────────
  platform-check:
    image: 100.108.142.49:5000/golang:1.21-alpine
    commands:
      - uname -m
      - test "$(uname -m)" = "x86_64" || (echo "构建机不是 x86_64，中止" && exit 1)

  # ── A 类：核心业务镜像（push 即构建）───────────────────
  build-app:
    image: 100.108.142.49:5000/docker:cli
    environment:
      GOPROXY_ARG: https://goproxy.cn,direct
      APK_MIRROR_ARG: mirrors.aliyun.com
    commands:
      - docker build --build-arg GOPROXY_ARG=$${GOPROXY_ARG} --build-arg APK_MIRROR_ARG=$${APK_MIRROR_ARG} -t 100.108.142.49:5000/wechatopenai/weknora-app:${CI_COMMIT_SHA} -t 100.108.142.49:5000/wechatopenai/weknora-app:latest -f docker/Dockerfile.app .
      - docker push 100.108.142.49:5000/wechatopenai/weknora-app:${CI_COMMIT_SHA}
      - docker push 100.108.142.49:5000/wechatopenai/weknora-app:latest

  build-ui:
    image: 100.108.142.49:5000/docker:cli
    commands:
      - docker build -t 100.108.142.49:5000/wechatopenai/weknora-ui:${CI_COMMIT_SHA} -t 100.108.142.49:5000/wechatopenai/weknora-ui:latest frontend/
      - docker push 100.108.142.49:5000/wechatopenai/weknora-ui:${CI_COMMIT_SHA}
      - docker push 100.108.142.49:5000/wechatopenai/weknora-ui:latest

  build-docreader:
    image: 100.108.142.49:5000/docker:cli
    commands:
      - docker build -t 100.108.142.49:5000/wechatopenai/weknora-docreader:${CI_COMMIT_SHA} -t 100.108.142.49:5000/wechatopenai/weknora-docreader:latest -f docker/Dockerfile.docreader .
      - docker push 100.108.142.49:5000/wechatopenai/weknora-docreader:${CI_COMMIT_SHA}
      - docker push 100.108.142.49:5000/wechatopenai/weknora-docreader:latest
    when:
      - path:
          - docreader/**
          - docker/Dockerfile.docreader

  # ── B 类：低频镜像（仅相关源码变更时构建）──────────────
  build-sandbox:
    image: 100.108.142.49:5000/docker:cli
    commands:
      - docker build -t 100.108.142.49:5000/wechatopenai/weknora-sandbox:${CI_COMMIT_SHA} -t 100.108.142.49:5000/wechatopenai/weknora-sandbox:latest -f docker/Dockerfile.sandbox .
      - docker push 100.108.142.49:5000/wechatopenai/weknora-sandbox:${CI_COMMIT_SHA}
      - docker push 100.108.142.49:5000/wechatopenai/weknora-sandbox:latest
    when:
      - path:
          - docker/Dockerfile.sandbox
          - scripts/build_browserskill.sh
          - scripts/browserskill-release.json

  build-mcp:
    image: 100.108.142.49:5000/docker:cli
    commands:
      - docker build -t 100.108.142.49:5000/weknora-mcp:${CI_COMMIT_SHA} -t 100.108.142.49:5000/weknora-mcp:latest mcp-server/
      - docker push 100.108.142.49:5000/weknora-mcp:${CI_COMMIT_SHA}
      - docker push 100.108.142.49:5000/weknora-mcp:latest
    when:
      - path:
          - mcp-server/**

  build-odl-hybrid:
    image: 100.108.142.49:5000/docker:cli
    commands:
      - docker build -t 100.108.142.49:5000/weknora-odl-hybrid:${CI_COMMIT_SHA} -t 100.108.142.49:5000/weknora-odl-hybrid:latest -f docker/Dockerfile.odl-hybrid .
      - docker push 100.108.142.49:5000/weknora-odl-hybrid:${CI_COMMIT_SHA}
      - docker push 100.108.142.49:5000/weknora-odl-hybrid:latest
    when:
      - path:
          - docker/Dockerfile.odl-hybrid

  # ── 部署：SSH 到两台生产机拉取并滚动更新 ───────────────
  # 前提：deploy 公钥已装入目标机 root@authorized_keys；
  #       私钥经 agent 的 WOODPECKER_BACKEND_DOCKER_VOLUMES 挂到步骤容器。
  deploy-zhaoyun:
    image: 100.108.142.49:5000/golang:1.21-alpine
    commands:
      - apk add --no-cache openssh-client
      - ssh -o StrictHostKeyChecking=accept-new -i /root/.ssh/deploy_ed25519 root@100.102.197.48 "cd /data/WeKnora && docker-compose pull && docker-compose up -d"
    when:
      - event: push
        branch: main

